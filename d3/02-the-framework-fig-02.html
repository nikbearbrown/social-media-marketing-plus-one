<!DOCTYPE html>

<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Decomposition of a LinkedIn CEO Thread</title>
<style>
:root{--color-white:#FFFFFF;--color-ink:#2a1a0e;--color-red:#C8102E;--color-secondary:#545454;--color-border:#D4D4D4;--color-ochre:#C8860E;--color-fill:#F5F5F5;}
@media (prefers-color-scheme: dark){:root{--color-white:#111111;--color-ink:#F0EBE3;--color-red:#E8243A;--color-secondary:#A0978C;--color-border:#2E2E2E;--color-ochre:#D49A30;--color-fill:#1A1A1A;}}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--color-white);color:var(--color-ink);font-family:'Inter',-apple-system,'Helvetica Neue',sans-serif;padding:24px;}
#chart{width:100%;min-height:720px;}
.tooltip{position:absolute;pointer-events:none;opacity:0;background:var(--color-ink);color:var(--color-white);padding:6px 10px;font-size:12px;transition:opacity 150ms;}
.title{font-family:'EB Garamond','Garamond',Georgia,serif;font-size:16px;fill:var(--color-ink);}
.subtitle{font-family:'Inter',sans-serif;font-size:12px;fill:var(--color-secondary);}
.step-num{font-family:'JetBrains Mono','Fira Code','Courier New',monospace;font-size:11px;}
.step-label{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;fill:var(--color-ink);}
.step-sub{font-family:'Inter',sans-serif;font-size:10px;fill:var(--color-secondary);}
.callout-label{font-family:'Inter',sans-serif;font-size:10px;font-weight:600;fill:var(--color-ochre);}
.callout-sub{font-family:'Inter',sans-serif;font-size:10px;fill:var(--color-ochre);}
.tally-label{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
</style></head><body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const STEPS=[
  {n:1,label:'Ideation',sub:'what is the thread about',role:'guard'},
  {n:2,label:'Angle selection',sub:'which take to defend',role:'guard',callout:{title:'requires knowing',sub:'what CEO believes'}},
  {n:3,label:'Outline drafting',sub:'given the angle',role:'delegate'},
  {n:4,label:'First-draft prose',sub:'edit pass is fast',role:'delegate'},
  {n:5,label:'Voice pass',sub:'does this sound like the CEO',role:'guard',callout:{title:'requires sustained',sub:'proximity'}},
  {n:6,label:'Hook refinement',sub:'opening line of thread',role:'guard',callout:{title:'voice most exposed',sub:'engagement decided here'}},
  {n:7,label:'Hashtag & tag generation',sub:'combinatorial',role:'delegate'},
  {n:8,label:'Publishing time + tuning',sub:'well-tooled',role:'delegate'},
  {n:9,label:'First-hour comment monitor',sub:'same voice replies',role:'guard'}
];
const tooltip=d3.select('body').append('div').attr('class','tooltip').style('position','absolute').style('opacity',0);
function showTooltip(event,html){tooltip.html(html).style('left',(event.pageX+12)+'px').style('top',(event.pageY-28)+'px').transition().duration(150).style('opacity',1);}
function moveTooltip(event){tooltip.style('left',(event.pageX+12)+'px').style('top',(event.pageY-28)+'px');}
function hideTooltip(){tooltip.transition().duration(100).style('opacity',0);}
function draw(){
  const container=document.getElementById('chart');
  d3.select(container).selectAll('*').remove();
  const W=container.clientWidth||800,H=720;
  const svg=d3.select(container).append('svg').attr('viewBox',`0 0 ${W} ${H}`).attr('role','img').attr('aria-labelledby','t d');
  svg.append('title').attr('id','t').text('Decomposition of a LinkedIn CEO Thread');
  svg.append('desc').attr('id','d').text('Nine-step vertical workflow. Six Delegate steps (gray) and three Guard steps (red). Callouts on three Guard steps name the reason: angle selection requires knowing what the CEO believes; voice pass requires sustained proximity; hook is where voice is most exposed.');
  svg.append('text').attr('class','title').attr('x',32).attr('y',32).text('Decomposition of a LinkedIn CEO Thread — Six Delegate, Three Guard');
  svg.append('text').attr('class','subtitle').attr('x',32).attr('y',52).text('Most real tasks are mixed. Whole-task delegation hides the structure.');
  const stepW=Math.min(320,W*0.42),stepH=50,gap=14,startY=90;
  const stepX=(W-stepW)/2-30; // shift left to give callouts room
  STEPS.forEach((s,i)=>{
    const y=startY+i*(stepH+gap);
    const isGuard=s.role==='guard';
    const fill=isGuard?'var(--color-red)':'var(--color-secondary)';
    const opacity=isGuard?0.18:0.20;
    svg.append('rect').attr('x',stepX).attr('y',y).attr('width',stepW).attr('height',stepH)
      .attr('fill',fill).attr('opacity',opacity).attr('stroke',fill).attr('stroke-width',1)
      .attr('tabindex',0).attr('aria-label',`Step ${s.n}: ${s.label} — ${isGuard?'Guard':'Delegate'} — ${s.sub}`)
      .on('mouseover',(event)=>showTooltip(event,`<strong>${s.n}. ${s.label}</strong><br>${isGuard?'Guard':'Delegate'} — ${s.sub}`)).on('mousemove',moveTooltip).on('mouseout',hideTooltip);
    svg.append('text').attr('class','step-num').attr('x',stepX+16).attr('y',y+30).attr('fill',isGuard?'var(--color-red)':'var(--color-secondary)').text(s.n);
    svg.append('text').attr('class','step-label').attr('x',stepX+38).attr('y',y+24).text(s.label);
    svg.append('text').attr('class','step-sub').attr('x',stepX+38).attr('y',y+40).text('— '+s.sub);
    // arrow to next
    if(i<STEPS.length-1){
      const ay=y+stepH+gap/2;
      svg.append('line').attr('x1',stepX+stepW/2).attr('y1',y+stepH).attr('x2',stepX+stepW/2).attr('y2',ay+2).attr('stroke','var(--color-ink)').attr('stroke-width',1);
      svg.append('polygon').attr('points',`${stepX+stepW/2},${ay+6} ${stepX+stepW/2-4},${ay} ${stepX+stepW/2+4},${ay}`).attr('fill','var(--color-ink)');
    }
    // callout
    if(s.callout){
      const cx=stepX+stepW+20;
      svg.append('line').attr('x1',stepX+stepW).attr('y1',y+stepH/2).attr('x2',cx).attr('y2',y+stepH/2).attr('stroke','var(--color-ochre)').attr('stroke-width',0.5);
      svg.append('circle').attr('cx',cx).attr('cy',y+stepH/2).attr('r',2.5).attr('fill','var(--color-ochre)');
      svg.append('text').attr('class','callout-label').attr('x',cx+6).attr('y',y+stepH/2-2).text(s.callout.title);
      svg.append('text').attr('class','callout-sub').attr('x',cx+6).attr('y',y+stepH/2+12).text(s.callout.sub);
    }
  });
  // tally tiles
  const tallyY=startY+STEPS.length*(stepH+gap)+20;
  const tally1X=stepX+30,tally2X=stepX+stepW-130;
  svg.append('rect').attr('x',tally1X).attr('y',tallyY).attr('width',100).attr('height',32).attr('fill','var(--color-secondary)').attr('opacity',0.25).attr('stroke','var(--color-secondary)').attr('stroke-width',1);
  svg.append('text').attr('class','tally-label').attr('x',tally1X+50).attr('y',tallyY+21).attr('text-anchor','middle').attr('fill','var(--color-ink)').text('6 Delegate');
  svg.append('rect').attr('x',tally2X).attr('y',tallyY).attr('width',100).attr('height',32).attr('fill','var(--color-red)').attr('opacity',0.18).attr('stroke','var(--color-red)').attr('stroke-width',1);
  svg.append('text').attr('class','tally-label').attr('x',tally2X+50).attr('y',tallyY+21).attr('text-anchor','middle').attr('fill','var(--color-red)').text('3 Guard');
}
draw();
new ResizeObserver(draw).observe(document.getElementById('chart'));
</script></body></html>
