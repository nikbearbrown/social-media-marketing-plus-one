  <polyline points="50,350 70,350 70,330 95,330 95,308 125,308 125,284 160,284 160,258 200,258 200,232 245,232 245,205 295,205 295,175 330,175" fill="none" stroke="#545454" stroke-width="2"/>
  <!-- Step circles at choice events -->
  <circle cx="70" cy="350" r="3" fill="#545454"/>
  <circle cx="95" cy="330" r="3" fill="#545454"/>
  <circle cx="125" cy="308" r="3" fill="#545454"/>
