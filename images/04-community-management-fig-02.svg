  <text x="350" y="232" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">vs</text>

  <!-- RIGHT PANEL — collapse -->
  <text x="440" y="92" font-family="'Inter', sans-serif" font-size="12" fill="#C8102E" font-weight="600">Detection collapses the entire history at once</text>

  <rect x="370" y="110" width="280" height="240" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>
  <line x1="370" y1="350" x2="370" y2="110" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="370" y1="350" x2="650" y2="350" stroke="#2a1a0e" stroke-width="1"/>
