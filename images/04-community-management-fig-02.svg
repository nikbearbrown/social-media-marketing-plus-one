  <rect x="50" y="110" width="280" height="240" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>
  <!-- Axes -->
  <line x1="50" y1="350" x2="50" y2="110" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="50" y1="350" x2="330" y2="350" stroke="#2a1a0e" stroke-width="1"/>
  <!-- Y label -->
  <text x="20" y="230" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#545454" transform="rotate(-90 20 230)">bond strength</text>
  <!-- X label -->
  <text x="190" y="372" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#545454">interactions over time</text>
  <!-- Y axis tick 0 -->
  <text x="44" y="354" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">0</text>
  <text x="44" y="114" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">100</text>

  <!-- Step line — normal accumulation: 0 -> 75 -->
