  <line x1="610" y1="170" x2="380" y2="170" stroke="#C8102E" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
  <text x="495" y="162" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#C8102E" font-style="italic">whole history reinterpreted</text>

  <!-- Non-recoverable marker beneath plot -->
  <rect x="430" y="392" width="160" height="20" fill="#C8102E"/>
  <text x="510" y="406" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">NON-RECOVERABLE</text>

  <text x="350" y="460" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#C8102E" font-style="italic">You don't lose one interaction. You lose the capital of all of them.</text>
