  <polyline points="370,350 390,350 390,330 415,330 415,308 445,308 445,284 480,284 480,258 520,258 520,232 565,232 565,205 615,205" fill="none" stroke="#C8102E" stroke-width="2" opacity="0.5"/>
  <circle cx="390" cy="350" r="3" fill="#C8102E" opacity="0.5"/>
  <circle cx="415" cy="330" r="3" fill="#C8102E" opacity="0.5"/>
  <circle cx="445" cy="308" r="3" fill="#C8102E" opacity="0.5"/>
