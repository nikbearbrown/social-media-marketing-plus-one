<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-02">
  <title id="fig-title-02">Parasocial Bond — Linear Accumulation, Retroactive Collapse</title>
  <desc>Two side-by-side panels. Left panel shows perceived bond strength rising as a gray step-line over many interactions, each step labeled as perceived choice by a human. Right panel shows the same accumulation, then a red marker at the rightmost interaction indicating automation detected, then a vertical drop to zero, then a red dashed sweep backward retroactively recoloring the prior curve. Beneath the right panel a red label reads non-recoverable.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" chapter="04-community-management" figure-number="02" figure-title="Parasocial Bond Accumulation and Retroactive Collapse" figure-type="image" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="chapters/04-community-management.md"/></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C8102E"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Bonds accumulate slowly. Detection reinterprets the whole history at once.</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">The parasocial mechanism Horton and Wohl named in 1956, applied to automated reply.</text>

