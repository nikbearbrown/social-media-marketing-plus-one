<svg viewBox="0 0 700 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-10-01 fig-desc-10-01">
  <title id="fig-title-10-01">Three-Axis Classification Space — The Guard List grows along the diagonal</title>
  <desc id="fig-desc-10-01">An isometric cube with three orthogonal axes — shape, regulatory weight, and reputational tail-risk. The near corner is the Delegate region; the far corner is the Guard region. A diagonal line shows the Guard List growing as tasks move toward the judgment-shaped, heavy-regulated, high-tail-risk corner.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" chapter="10-building-your-own-map" figure-number="01" figure-title="Three-Axis Classification Space" figure-type="infographic" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="chapters/10-building-your-own-map.md"/></metadata>
  <defs>
    <marker id="arrowM" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="540" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Three-axis classification — where the Guard List grows</text>
  <text x="32" y="56" font-family="'Inter', sans-serif" font-size="11" fill="#545454">Shape × Regulatory weight × Reputational tail-risk. The corner you sit in decides the map.</text>

  <!-- Cube vertices (isometric projection)
       origin (near-front-bottom-left) at (180, 420)
       x-axis (shape) → right, to (560, 420)
       y-axis (regulatory weight) → up, to (180, 140)
       z-axis (tail-risk) → up-right isometric, to (300, 340)
       Eight vertices:
         A near-origin    (pat, light, low)   = (180, 420)
         B  +x            (jud, light, low)   = (560, 420)
         C  +y            (pat, heavy, low)   = (180, 140)
         D  +x+y          (jud, heavy, low)   = (560, 140)
         E  +z            (pat, light, high)  = (300, 340)
         F  +x+z          (jud, light, high)  = (680, 340)
         G  +y+z          (pat, heavy, high)  = (300, 60)
         H  +x+y+z (far)  (jud, heavy, high)  = (680, 60)
  -->

  <!-- Cube edges — Sky Blue dashed (we substitute Secondary as Sky Blue is not in palette) -->
  <!-- Back face -->
  <line x1="300" y1="340" x2="680" y2="340" stroke="#787878" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="300" y1="340" x2="300" y2="60" stroke="#787878" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="680" y1="340" x2="680" y2="60" stroke="#787878" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="300" y1="60" x2="680" y2="60" stroke="#787878" stroke-width="0.5" stroke-dasharray="3,3"/>
  <!-- Connectors front-to-back -->
  <line x1="180" y1="420" x2="300" y2="340" stroke="#787878" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="560" y1="420" x2="680" y2="340" stroke="#787878" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="180" y1="140" x2="300" y2="60" stroke="#787878" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="560" y1="140" x2="680" y2="60" stroke="#787878" stroke-width="0.5" stroke-dasharray="3,3"/>
  <!-- Front face edges shown more strongly via axis lines -->

  <!-- Axes (solid, with arrowheads) -->
  <line x1="180" y1="420" x2="588" y2="420" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrowM)"/>
  <line x1="180" y1="420" x2="180" y2="120" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrowM)"/>
  <line x1="180" y1="420" x2="310" y2="334" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrowM)"/>

  <!-- Axis labels -->
  <text x="600" y="424" font-family="'Inter', sans-serif" font-size="11" fill="#545454">shape →</text>
  <text x="600" y="438" font-family="'Inter', sans-serif" font-size="10" fill="#545454">judgment</text>
  <text x="135" y="424" font-family="'Inter', sans-serif" font-size="10" fill="#545454" text-anchor="end">pattern</text>

  <text x="186" y="116" font-family="'Inter', sans-serif" font-size="11" fill="#545454">regulatory weight ↑</text>
  <text x="186" y="130" font-family="'Inter', sans-serif" font-size="10" fill="#545454">heavy</text>
  <text x="186" y="412" font-family="'Inter', sans-serif" font-size="10" fill="#545454">light</text>

  <text x="318" y="326" font-family="'Inter', sans-serif" font-size="11" fill="#545454">tail-risk ↗</text>
  <text x="318" y="340" font-family="'Inter', sans-serif" font-size="10" fill="#545454">high</text>

  <!-- Vertex nodes -->
  <!-- A — Delegate corner (pat, light, low) -->
  <circle cx="180" cy="420" r="10" fill="#545454"/>
  <text x="160" y="450" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#545454">Delegate</text>
  <!-- B (jud, light, low) — boundary -->
  <circle cx="560" cy="420" r="8" fill="#C8860E"/>
  <!-- C (pat, heavy, low) — boundary -->
  <circle cx="180" cy="140" r="8" fill="#C8860E"/>
  <!-- D (jud, heavy, low) — boundary -->
  <circle cx="560" cy="140" r="8" fill="#C8860E"/>
  <!-- E (pat, light, high) — boundary -->
  <circle cx="300" cy="340" r="8" fill="#C8860E"/>
  <!-- F (jud, light, high) — boundary -->
  <circle cx="680" cy="340" r="8" fill="#C8860E"/>
  <!-- G (pat, heavy, high) — boundary -->
  <circle cx="300" cy="60" r="8" fill="#C8860E"/>
  <!-- H — Guard corner (jud, heavy, high) -->
  <circle cx="680" cy="60" r="10" fill="#C8102E"/>
  <text x="618" y="50" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#C8102E">Guard</text>

  <!-- Diagonal — the Guard List growth axis -->
  <line x1="180" y1="420" x2="680" y2="60" stroke="#2a1a0e" stroke-width="1.25" stroke-dasharray="6,4"/>

  <!-- Diagonal label -->
  <text x="380" y="240" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#2a1a0e" transform="rotate(-30, 380, 240)">Guard List grows along this diagonal</text>

  <!-- Legend -->
  <rect x="56" y="488" width="588" height="36" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>
  <circle cx="80" cy="506" r="6" fill="#545454"/>
  <text x="94" y="510" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e">Delegate corner — pattern, light reg, low tail-risk</text>
  <circle cx="310" cy="506" r="6" fill="#C8860E"/>
  <text x="324" y="510" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e">Boundary vertex</text>
  <circle cx="450" cy="506" r="6" fill="#C8102E"/>
  <text x="464" y="510" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e">Guard corner — judgment, heavy reg, high tail-risk</text>
</svg>
