  <title id="fig-title-02">Decomposition of a CEO LinkedIn Essay — 13 Steps</title>
  <desc>Vertical workflow of thirteen numbered steps for drafting a CEO LinkedIn essay. Five steps are Guard (red): topic, angle, voice pass, hook, close, decision to publish. Eight steps are Delegate (gray): research, outline, draft, hashtags, timing, pre-publication check, comment sorting. Step 13 is split — sorting delegated, responding guarded. Tally at the bottom: 8 Delegate, 5 Guard.</desc>
