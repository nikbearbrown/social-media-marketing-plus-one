  <text x="480" y="246" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">capability and erode</text>
  <text x="480" y="260" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">structural barriers too;</text>
  <text x="480" y="274" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">Guard List approaches</text>
  <text x="480" y="288" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">empty.</text>

  <text x="480" y="318" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#2a1a0e">would change mind if:</text>
  <text x="480" y="334" font-family="'Inter', sans-serif" font-size="10" fill="#545454">a public crisis is</text>
  <text x="480" y="348" font-family="'Inter', sans-serif" font-size="10" fill="#545454">resolved cleanly by</text>
  <text x="480" y="362" font-family="'Inter', sans-serif" font-size="10" fill="#545454">an AI agent without</text>
  <text x="480" y="376" font-family="'Inter', sans-serif" font-size="10" fill="#545454">a named human owner.</text>

  <text x="480" y="406" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#787878">Amodei,</text>
  <text x="480" y="418" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#787878">continuation-scaling camp</text>

  <circle cx="564" cy="428" r="6" fill="#ADADAD"/>

  <!-- Bottom: shared question -->
  <text x="350" y="465" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#545454">Pick a camp. Write down the falsifier. Re-read it every quarter.</text>
