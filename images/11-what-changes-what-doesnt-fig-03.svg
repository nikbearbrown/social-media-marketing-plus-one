  <text x="268" y="216" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#2a1a0e">predicts</text>
  <text x="268" y="232" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">capability keeps closing;</text>
  <text x="268" y="246" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">attribution-bound items</text>
  <text x="268" y="260" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">stay human; Guard List</text>
  <text x="268" y="274" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">shrinks in quantity, grows</text>
  <text x="268" y="288" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">in judgment density.</text>

  <text x="268" y="318" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#2a1a0e">would change mind if:</text>
  <text x="268" y="334" font-family="'Inter', sans-serif" font-size="10" fill="#545454">regulators accept</text>
  <text x="268" y="348" font-family="'Inter', sans-serif" font-size="10" fill="#545454">AI sign-off as compliant;</text>
  <text x="268" y="362" font-family="'Inter', sans-serif" font-size="10" fill="#545454">audiences stop</text>
  <text x="268" y="376" font-family="'Inter', sans-serif" font-size="10" fill="#545454">distinguishing voice.</text>

  <text x="268" y="406" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#C8102E">the position of</text>
  <text x="268" y="418" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#C8102E">this book</text>

  <circle cx="352" cy="428" r="6" fill="#C8102E"/>

