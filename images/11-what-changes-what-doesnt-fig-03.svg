<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-03">
  <title id="fig-title-03">Three Trajectory Camps</title>
  <desc>Three columns name the current camps on AI capability trajectory — Capability stagnation, Capability plus structural limits, and Capability solves judgment. Each lists what the camp predicts and what evidence would change its mind. The middle camp is highlighted as the book's working assumption.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" book-slug="social-media-marketing-plus-one" chapter="11-what-changes-what-doesnt" figure-number="03" figure-title="Three Trajectory Camps" figure-slug="three-trajectory-camps" figure-type="comparison" priority="Important" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="pantry/11-what-changes-what-doesnt-cajal.md"/></metadata>
