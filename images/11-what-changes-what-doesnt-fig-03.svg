  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Three trajectory camps — what each one predicts, and what would change its mind</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">The book sits in the middle camp: capability keeps closing, but structural reasons keep some work human.</text>

  <!-- Column 1: Capability stagnation -->
  <rect x="40" y="80" width="200" height="360" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>
  <rect x="40" y="80" width="200" height="40" fill="#787878"/>
  <text x="140" y="98" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Camp 1</text>
  <text x="140" y="113" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#FFFFFF">Capability stagnation</text>

  <!-- Mini curve illustration -->
  <line x1="60" y1="190" x2="220" y2="190" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="60" y1="135" x2="60" y2="190" stroke="#2a1a0e" stroke-width="1"/>
  <path d="M 60 175 Q 110 162 160 158 T 220 156" fill="none" stroke="#787878" stroke-width="1.5"/>

  <text x="56" y="216" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#2a1a0e">predicts</text>
  <text x="56" y="232" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">scaling laws bend;</text>
  <text x="56" y="246" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">capability flattens;</text>
  <text x="56" y="260" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">Guard List shape</text>
  <text x="56" y="274" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">stays roughly as today.</text>

  <text x="56" y="304" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#2a1a0e">would change mind if:</text>
  <text x="56" y="320" font-family="'Inter', sans-serif" font-size="10" fill="#545454">METR doublings continue</text>
  <text x="56" y="334" font-family="'Inter', sans-serif" font-size="10" fill="#545454">past 12 more months;</text>
  <text x="56" y="348" font-family="'Inter', sans-serif" font-size="10" fill="#545454">long-horizon agent</text>
  <text x="56" y="362" font-family="'Inter', sans-serif" font-size="10" fill="#545454">benchmarks crack.</text>

  <text x="56" y="392" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#787878">LeCun, Marcus,</text>
  <text x="56" y="406" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#787878">Kambhampati</text>

