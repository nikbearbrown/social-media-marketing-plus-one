  <text x="210" y="440" font-family="'Inter', sans-serif" font-size="13" fill="#2a1a0e" font-weight="600">Hook refinement</text>
  <text x="330" y="440" font-family="'Inter', sans-serif" font-size="10" fill="#545454">— opening line of thread</text>
