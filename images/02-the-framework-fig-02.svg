<svg viewBox="0 0 700 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Decomposition of a LinkedIn CEO Thread</title>
  <desc id="fig-desc">A vertical nine-step workflow for a LinkedIn CEO thought-leadership thread. Six Delegate steps and three Guard steps. Callouts on the three Guard steps name the reason each requires a human: angle selection requires knowing what the CEO believes; voice pass requires sustained proximity; hook is where voice is most exposed. A bottom tally shows six Delegate and three Guard.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" book-slug="social-media-marketing-plus-one" chapter="02-the-framework" figure-number="02" figure-title="Decomposition of a LinkedIn CEO Thread" figure-slug="ceo-thread-decomposition" figure-type="decomposition" priority="Critical" author="Humanitarians AI" date-generated="2026-05-27" source-file="pantry/02-the-framework-cajal.md"/></metadata>
  <rect x="0" y="0" width="700" height="720" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Decomposition of a LinkedIn CEO Thread — Six Delegate, Three Guard</text>
  <text x="32" y="56" font-family="'Inter', sans-serif" font-size="11" fill="#545454">Most real tasks are mixed. Whole-task delegation hides the structure.</text>

  <!-- Steps: x=160, w=300, step-height 50, gap 14 (total 64 per step) starting y=90 -->
