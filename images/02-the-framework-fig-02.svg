  <text x="210" y="312" font-family="'Inter', sans-serif" font-size="13" fill="#2a1a0e" font-weight="600">First-draft prose</text>
  <text x="332" y="312" font-family="'Inter', sans-serif" font-size="10" fill="#545454">— edit pass is fast</text>
