  <rect x="160" y="154" width="300" height="50" fill="#C8102E" opacity="0.18" stroke="#C8102E" stroke-width="1"/>
  <text x="180" y="184" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C8102E">2</text>
  <text x="210" y="184" font-family="'Inter', sans-serif" font-size="13" fill="#2a1a0e" font-weight="600">Angle selection</text>
  <text x="325" y="184" font-family="'Inter', sans-serif" font-size="10" fill="#545454">— which take to defend</text>
  <!-- Callout right -->
