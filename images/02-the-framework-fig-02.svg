  <text x="503" y="188" font-family="'Inter', sans-serif" font-size="10" fill="#C8860E">what CEO believes</text>
  <polygon points="310,218 306,212 314,212" fill="#2a1a0e"/>
  <line x1="310" y1="204" x2="310" y2="214" stroke="#2a1a0e" stroke-width="1"/>

