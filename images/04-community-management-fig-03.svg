<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-03">
  <title id="fig-title-03">Inbox Routing by Personal-Stakes Axis</title>
  <desc>A horizontal personal-stakes axis runs from low stakes on the left to high stakes on the right. Six message-type tiles sit along the axis. Low-stakes tiles route to Delegate. High-stakes tiles route to Guard. A central boundary band marks the zone where routing requires explicit judgment.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" book-slug="social-media-marketing-plus-one" chapter="04-community-management" figure-number="03" figure-title="Inbox Routing by Personal-Stakes Axis" figure-slug="inbox-routing-axis" figure-type="decision-diagram" priority="Important" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="pantry/04-community-management-cajal.md"/></metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker></defs>
  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Route by personal stakes for the sender, not by message-type label</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">The diagnostic: imagine the recipient discovering automation three weeks later. Does the relationship survive?</text>

  <!-- Central boundary zone -->
  <rect x="305" y="200" width="90" height="100" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>
  <text x="350" y="216" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#545454">BOUNDARY</text>
  <text x="350" y="228" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#545454">explicit judgment</text>
  <text x="350" y="240" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#545454">required</text>

  <!-- Personal-stakes axis -->
  <line x1="60" y1="250" x2="640" y2="250" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="60" y="270" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#545454">LOW STAKES</text>
  <text x="640" y="270" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#C8102E">HIGH STAKES</text>
  <text x="350" y="270" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#545454">personal stakes for sender →</text>

  <!-- Tick marks -->
  <g stroke="#2a1a0e" stroke-width="1">
    <line x1="100" y1="246" x2="100" y2="254"/>
    <line x1="190" y1="246" x2="190" y2="254"/>
    <line x1="280" y1="246" x2="280" y2="254"/>
    <line x1="420" y1="246" x2="420" y2="254"/>
    <line x1="510" y1="246" x2="510" y2="254"/>
    <line x1="600" y1="246" x2="600" y2="254"/>
  </g>

  <!-- Top label zones -->
  <text x="170" y="92" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#545454">Delegate-safe</text>
  <text x="170" y="106" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#545454">automate the surface</text>
  <text x="530" y="92" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C8102E">Guard — human-only</text>
  <text x="530" y="106" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#545454">never automate the signal</text>

  <!-- Connector lines from axis to tiles (above) -->
  <!-- Low-stakes tile 1: routine factual query (above) -->
  <line x1="100" y1="246" x2="100" y2="170" stroke="#D4D4D4" stroke-width="0.75"/>
  <rect x="50" y="125" width="100" height="46" fill="#545454" opacity="0.18" stroke="#545454" stroke-width="1"/>
  <text x="100" y="145" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#2a1a0e">Routine</text>
  <text x="100" y="158" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">factual query</text>
  <text x="100" y="190" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#545454">FAQ, hours, link</text>

  <!-- Low-stakes tile 2: spam / abuse moderation (above) -->
  <line x1="190" y1="246" x2="190" y2="170" stroke="#D4D4D4" stroke-width="0.75"/>
  <rect x="140" y="125" width="100" height="46" fill="#545454" opacity="0.18" stroke="#545454" stroke-width="1"/>
  <text x="190" y="145" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#2a1a0e">Spam / abuse</text>
  <text x="190" y="158" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">moderation</text>
  <text x="190" y="190" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#545454">classifier, queue</text>

  <!-- Boundary tile: first-touch acknowledgment (straddles boundary, Delegate fill + Guard outline) -->
  <line x1="280" y1="246" x2="280" y2="170" stroke="#D4D4D4" stroke-width="0.75"/>
  <rect x="230" y="125" width="100" height="46" fill="#545454" opacity="0.18" stroke="#C8102E" stroke-width="1.5"/>
  <text x="280" y="145" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#2a1a0e">First-touch</text>
  <text x="280" y="158" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">acknowledgment</text>
  <text x="280" y="190" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#C8102E">delegate with template — flagged</text>

  <!-- High-stakes tile 4: high-personal-stakes DM (below) -->
  <line x1="420" y1="254" x2="420" y2="330" stroke="#D4D4D4" stroke-width="0.75"/>
  <rect x="370" y="328" width="100" height="46" fill="#C8102E" opacity="0.18" stroke="#C8102E" stroke-width="1"/>
  <text x="420" y="348" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#2a1a0e">High-stakes</text>
  <text x="420" y="361" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">DM</text>
  <text x="420" y="392" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#545454">grievance, complaint</text>

  <!-- High-stakes tile 5: ongoing relationship reply (below) -->
  <line x1="510" y1="254" x2="510" y2="330" stroke="#D4D4D4" stroke-width="0.75"/>
  <rect x="460" y="328" width="100" height="46" fill="#C8102E" opacity="0.18" stroke="#C8102E" stroke-width="1"/>
  <text x="510" y="348" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#2a1a0e">Ongoing</text>
  <text x="510" y="361" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">relationship reply</text>
  <text x="510" y="392" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#545454">parasocial bond at risk</text>

  <!-- High-stakes tile 6: crisis-window statement (below) -->
  <line x1="600" y1="254" x2="600" y2="330" stroke="#D4D4D4" stroke-width="0.75"/>
  <rect x="550" y="328" width="100" height="46" fill="#C8102E" opacity="0.18" stroke="#C8102E" stroke-width="1"/>
  <text x="600" y="348" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#2a1a0e">Crisis-window</text>
  <text x="600" y="361" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">statement</text>
  <text x="600" y="392" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#545454">documented protocol</text>

  <!-- Diagnostic callout (ochre, decorative) pointing to right-side tiles -->
  <line x1="600" y1="378" x2="660" y2="420" stroke="#C8860E" stroke-width="0.75"/>
  <text x="660" y="436" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#C8860E">diagnostic — imagine three weeks later</text>

  <!-- Legend -->
  <rect x="40" y="436" width="14" height="14" fill="#545454" opacity="0.18" stroke="#545454" stroke-width="1"/>
  <text x="60" y="447" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">Delegate</text>
  <rect x="130" y="436" width="14" height="14" fill="#C8102E" opacity="0.18" stroke="#C8102E" stroke-width="1"/>
  <text x="150" y="447" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">Guard</text>
  <rect x="210" y="436" width="14" height="14" fill="#545454" opacity="0.18" stroke="#C8102E" stroke-width="1.5"/>
  <text x="230" y="447" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">Boundary straddler — delegate with flag</text>
</svg>
