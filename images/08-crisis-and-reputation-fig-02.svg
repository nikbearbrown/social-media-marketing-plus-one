  <polygon points="280,215 360,250 280,285 200,250" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="280" y="245" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#2a1a0e">Brand voice</text>
  <text x="280" y="259" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#2a1a0e">irreverent?</text>

  <line x1="240" y1="275" x2="200" y2="320" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="200" y="305" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">yes</text>

