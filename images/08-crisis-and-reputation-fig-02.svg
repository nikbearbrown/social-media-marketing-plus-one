  <title id="fig-title-02">Coombs SCCT — crisis type to posture decision tree</title>
  <desc id="fig-desc-02">A vertical decision tree mapping Coombs Situational Crisis Communication Theory clusters (victim, accidental, preventable) onto five response postures: operational customer-service, ironic self-aware, named-executive personal acknowledgment, corporate-legal-formal with counsel, and deliberate silence (off-tree, brigade-only).</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" book-slug="social-media-marketing-plus-one" chapter="08-crisis-and-reputation" figure-number="02" figure-title="Coombs SCCT — crisis type to posture decision tree" figure-slug="coombs-scct-posture-decision-tree" figure-type="DECISION_TREE" priority="Critical" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="pantry/08-crisis-and-reputation-cajal.md"/></metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker></defs>
  <rect x="0" y="0" width="700" height="600" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Coombs SCCT — picking the posture is the load-bearing decision</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Crisis type drives posture. Monitoring told you it fired. Typology tells you what to say.</text>

  <!-- Root diamond: crisis type? -->
  <polygon points="280,80 400,130 280,180 160,130" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="280" y="124" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#2a1a0e">Coombs crisis type?</text>
  <text x="280" y="140" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#545454">attribution of responsibility</text>

  <!-- Three branches from root -->
  <!-- Left: Victim cluster -->
  <line x1="210" y1="155" x2="120" y2="210" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="130" y="180" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">Victim</text>
  <text x="130" y="194" font-family="'JetBrains Mono', monospace" font-size="9" fill="#787878">disaster · rumor</text>

  <!-- Middle: Accidental -->
  <line x1="280" y1="180" x2="280" y2="210" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="288" y="200" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">Accidental</text>

  <!-- Right: Preventable -->
  <line x1="350" y1="155" x2="450" y2="210" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="420" y="180" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">Preventable</text>
  <text x="420" y="194" font-family="'JetBrains Mono', monospace" font-size="9" fill="#787878">negligence · misdeed</text>

  <!-- LEFT TERMINAL: Victim → Operational customer-service (gray) -->
  <rect x="40" y="215" width="170" height="65" fill="#545454" stroke="#2a1a0e" stroke-width="1"/>
  <text x="125" y="237" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Operational</text>
  <text x="125" y="253" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">customer-service</text>
  <text x="125" y="271" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" fill="#FFFFFF">Diminish posture · empathy first</text>

