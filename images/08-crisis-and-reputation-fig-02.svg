  <text x="205" y="365" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" fill="#FFFFFF">KFC FCK · use sparingly</text>
  <text x="205" y="379" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" fill="#FFFFFF">Rebuild via humor</text>

  <rect x="300" y="325" width="170" height="65" fill="#545454" stroke="#2a1a0e" stroke-width="1"/>
  <text x="385" y="347" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Operational +</text>
