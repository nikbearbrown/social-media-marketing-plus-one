  <text x="540" y="259" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#2a1a0e">exposure?</text>

  <line x1="500" y1="275" x2="465" y2="320" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="465" y="305" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">no</text>

  <line x1="580" y1="275" x2="620" y2="320" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="610" y="305" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">yes</text>

  <rect x="370" y="325" width="170" height="65" fill="#C8102E" stroke="#2a1a0e" stroke-width="1"/>
  <text x="455" y="347" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Named-executive</text>
  <text x="455" y="362" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">acknowledgment</text>
  <text x="455" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" fill="#FFFFFF">Rebuild · apology + action</text>

  <rect x="544" y="325" width="116" height="65" fill="#C8102E" stroke="#2a1a0e" stroke-width="1"/>
  <rect x="539" y="320" width="126" height="75" fill="none" stroke="#C8102E" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="602" y="347" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Corporate-legal</text>
  <text x="602" y="362" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">formal</text>
  <text x="602" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" fill="#FFFFFF">counsel-led · Boeing</text>

  <!-- Off-tree terminal: Deliberate Silence -->
  <line x1="60" y1="440" x2="180" y2="440" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="60" y="445" width="170" height="65" fill="#2a1a0e" stroke="#2a1a0e" stroke-width="1"/>
  <text x="145" y="467" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Deliberate silence</text>
  <text x="145" y="483" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" fill="#FFFFFF">off-tree · brigade-only</text>
  <text x="145" y="497" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" fill="#FFFFFF">no real grievance</text>

  <text x="60" y="428" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-size="12" fill="#545454">special case · use rarely</text>

