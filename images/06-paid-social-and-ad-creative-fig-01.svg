<svg viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-01">
  <title id="fig-title-01">The AI-vs-AI loop</title>
  <desc>Circular flow of four AI layers — generative creative, AI media buying, AI-modeled audiences, AI attribution — with annotations at each transition showing what drops out (concept, new audience, brand signal, incrementality). The brief sits at the centre as the only human intervention point.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" chapter="06-paid-social-and-ad-creative" figure-number="01" figure-title="The AI-vs-AI loop" figure-type="INFOGRAPHIC" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="chapters/06-paid-social-and-ad-creative.md"/></metadata>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2a1a0e"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#C8102E"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="600" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">The AI-vs-AI loop — competent at each step, brand-shallow as a whole</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Each transition loses something the dashboard does not measure. The brief is the only intervention point.</text>

  <!-- Ring centre -->
  <!-- cx 350 cy 320 radius for nodes 180 -->

  <!-- Loop arrows (clockwise) — drawn as curved arcs -->
  <!-- North to East -->
  <path d="M 460 220 A 180 180 0 0 1 460 420" fill="none" stroke="#2a1a0e" stroke-width="1.25" marker-end="url(#arrow)"/>
  <!-- East to South -->
  <path d="M 450 430 A 180 180 0 0 1 250 430" fill="none" stroke="#2a1a0e" stroke-width="1.25" marker-end="url(#arrow)"/>
  <!-- South to West -->
  <path d="M 240 420 A 180 180 0 0 1 240 220" fill="none" stroke="#2a1a0e" stroke-width="1.25" marker-end="url(#arrow)"/>
  <!-- West to North -->
  <path d="M 250 210 A 180 180 0 0 1 450 210" fill="none" stroke="#2a1a0e" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- Four cardinal nodes -->
  <!-- North: generative creative -->
  <rect x="280" y="160" width="140" height="60" fill="#F5F5F5" stroke="#545454" stroke-width="1"/>
  <text x="350" y="184" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#2a1a0e">Generative</text>
  <text x="350" y="202" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#2a1a0e">creative</text>

  <!-- East: AI media buying -->
  <rect x="470" y="290" width="160" height="60" fill="#F5F5F5" stroke="#545454" stroke-width="1"/>
  <text x="550" y="314" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#2a1a0e">AI media</text>
  <text x="550" y="332" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#2a1a0e">buying</text>

  <!-- South: AI-modeled audiences -->
  <rect x="280" y="420" width="140" height="60" fill="#F5F5F5" stroke="#545454" stroke-width="1"/>
  <text x="350" y="444" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#2a1a0e">AI-modeled</text>
  <text x="350" y="462" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#2a1a0e">audiences</text>

  <!-- West: AI attribution -->
  <rect x="70" y="290" width="160" height="60" fill="#F5F5F5" stroke="#545454" stroke-width="1"/>
  <text x="150" y="314" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#2a1a0e">AI</text>
  <text x="150" y="332" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#2a1a0e">attribution</text>

  <!-- Drop-out markers at four loop midpoints (NE, SE, SW, NW) -->
  <!-- NE -->
  <circle cx="495" cy="220" r="6" fill="#C8860E"/>
  <text x="540" y="225" font-family="'Inter', sans-serif" font-size="11" fill="#545454">— concept drops out</text>
  <!-- SE -->
  <circle cx="495" cy="420" r="6" fill="#C8860E"/>
  <text x="540" y="425" font-family="'Inter', sans-serif" font-size="11" fill="#545454">— incrementality drops out</text>
  <!-- SW -->
  <circle cx="205" cy="420" r="6" fill="#C8860E"/>
  <text x="40" y="425" font-family="'Inter', sans-serif" font-size="11" fill="#545454">brand signal drops out —</text>
  <!-- NW -->
  <circle cx="205" cy="220" r="6" fill="#C8860E"/>
  <text x="40" y="225" font-family="'Inter', sans-serif" font-size="11" fill="#545454">new-audience reach drops out —</text>

  <!-- Central brief node (Guard) -->
  <rect x="305" y="295" width="90" height="50" fill="#C8102E" stroke="#2a1a0e" stroke-width="1"/>
  <text x="350" y="318" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="14" fill="#FFFFFF">The brief</text>
  <text x="350" y="335" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#FFFFFF">(human)</text>

  <!-- Radial intervention arrows from brief to each node -->
  <line x1="350" y1="295" x2="350" y2="226" stroke="#C8102E" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-red)"/>
  <line x1="395" y1="320" x2="465" y2="320" stroke="#C8102E" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-red)"/>
  <line x1="350" y1="345" x2="350" y2="414" stroke="#C8102E" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-red)"/>
  <line x1="305" y1="320" x2="236" y2="320" stroke="#C8102E" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-red)"/>

  <!-- Legend -->
  <g transform="translate(32,540)">
    <rect x="0" y="0" width="16" height="12" fill="#F5F5F5" stroke="#545454" stroke-width="1"/>
    <text x="22" y="10" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e">AI layer (Delegate)</text>
    <rect x="180" y="0" width="16" height="12" fill="#C8102E"/>
    <text x="202" y="10" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e">Human intervention (Guard)</text>
    <circle cx="408" cy="6" r="5" fill="#C8860E"/>
    <text x="420" y="10" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e">What drops out at each transition</text>
  </g>
  <text x="32" y="578" font-family="'Inter', sans-serif" font-size="10.5" fill="#545454">Byron Sharp 2010 · Binet &amp; Field 2013 · Lewis-Rao 2015</text>
</svg>
