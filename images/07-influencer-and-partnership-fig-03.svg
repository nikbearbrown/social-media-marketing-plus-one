    <circle cx="220" cy="245" r="6"/>
    <circle cx="245" cy="225" r="6"/>
  </g>
  <text x="230" y="135" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="13" font-weight="700" fill="#2a1a0e">Micro sweet spot</text>
  <text x="230" y="148" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#545454">tight audience, high engagement</text>

  <!-- Top-right quadrant: rare ideal (one red dot with ring) -->
  <circle cx="470" cy="180" r="11" fill="#C8102E"/>
  <circle cx="470" cy="180" r="18" fill="none" stroke="#C8102E" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="470" y="135" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="13" font-weight="700" fill="#C8102E">Rare ideal</text>
  <text x="470" y="148" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#545454">authentic fit at scale</text>
  <text x="470" y="220" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#545454">hard to find · book early</text>

  <!-- Bottom-right quadrant: mega-creator default (medium dense, gray) -->
  <g fill="#ADADAD">
    <circle cx="400" cy="335" r="7"/>
    <circle cx="440" cy="360" r="7"/>
    <circle cx="475" cy="335" r="7"/>
