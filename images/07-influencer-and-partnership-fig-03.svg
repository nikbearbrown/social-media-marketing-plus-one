<svg viewBox="0 0 700 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-03 fig-desc-03">
  <title id="fig-title-03">Fit-vs-reach matrix</title>
  <desc id="fig-desc-03">A 2x2 matrix with reach on the x-axis and fit on the y-axis. Four quadrants name the archetypes — micro-creator sweet spot, rare ideal, mega-creator default, rejection zone. A De Veirman log-linear decay curve overlays the diagonal showing engagement-per-follower decreases as reach grows.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" book-slug="social-media-marketing-plus-one" chapter="07-influencer-and-partnership" figure-number="03" figure-title="Fit-vs-reach matrix" figure-slug="fit-vs-reach-matrix" figure-type="MATRIX" priority="Critical" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="pantry/07-influencer-and-partnership-cajal.md"/></metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker></defs>
  <rect x="0" y="0" width="700" height="540" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Fit-vs-reach — where the tier decisions actually sit</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">De Veirman, Cauberghe &amp; Hudders (2017): engagement-per-follower decays log-linearly with follower count.</text>

  <!-- Plot region 480x380 starting at x=110, y=90 -->
  <rect x="110" y="90" width="480" height="380" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>

  <!-- Quadrant divider lines -->
  <line x1="350" y1="90" x2="350" y2="470" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="110" y1="280" x2="590" y2="280" stroke="#2a1a0e" stroke-width="1"/>

  <!-- Axis lines (left and bottom) -->
  <line x1="110" y1="90" x2="110" y2="470" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="110" y1="470" x2="590" y2="470" stroke="#2a1a0e" stroke-width="1"/>

  <!-- Axis titles -->
  <text x="350" y="500" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#2a1a0e">Reach — follower count (log scale)</text>
  <text x="50" y="280" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#2a1a0e" transform="rotate(-90 50 280)">Fit — audience-creator alignment</text>

  <!-- Axis tick labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">
    <text x="116" y="484">10k</text>
    <text x="290" y="484">100k</text>
    <text x="525" y="484">1M+</text>
    <text x="104" y="473" text-anchor="end">low</text>
    <text x="104" y="284" text-anchor="end">mid</text>
    <text x="104" y="96" text-anchor="end">high</text>
  </g>

  <!-- Quadrant background labels (top-left, top-right, bottom-left, bottom-right) -->
  <text x="120" y="110" font-family="'JetBrains Mono', monospace" font-size="9" fill="#787878">high fit · low reach</text>
  <text x="360" y="110" font-family="'JetBrains Mono', monospace" font-size="9" fill="#787878">high fit · high reach</text>
  <text x="120" y="300" font-family="'JetBrains Mono', monospace" font-size="9" fill="#787878">low fit · low reach</text>
  <text x="360" y="300" font-family="'JetBrains Mono', monospace" font-size="9" fill="#787878">low fit · high reach</text>

  <!-- Top-left quadrant: micro-creator sweet spot (gray dense cluster) -->
  <g fill="#545454">
    <circle cx="155" cy="160" r="6"/>
    <circle cx="185" cy="180" r="6"/>
