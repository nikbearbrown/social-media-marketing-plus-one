  <text x="470" y="453" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#545454">reach without resonance — pay-for-impressions trap</text>

  <!-- Bottom-left quadrant: rejection zone (single outlined circle) -->
  <circle cx="180" cy="395" r="9" fill="none" stroke="#787878" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="180" y="380" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="13" font-weight="700" fill="#2a1a0e">Avoid</text>
  <text x="180" y="425" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#545454">neither fit nor scale</text>

  <!-- De Veirman log-linear decay curve from top-left to bottom-right -->
  <path d="M 130 130 Q 280 175, 380 280 T 580 445" fill="none" stroke="#C8860E" stroke-width="1.5"/>

  <!-- Inflection marker on the curve at quadrant boundary -->
  <circle cx="350" cy="232" r="5" fill="#C8860E"/>
  <text x="362" y="220" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-size="12" fill="#C8860E">inflection — where</text>
  <text x="362" y="234" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-size="12" fill="#C8860E">most tier decisions sit</text>

  <!-- Legend -->
  <g transform="translate(32,510)">
    <circle cx="6" cy="6" r="6" fill="#545454"/>
    <text x="20" y="10" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e">Candidates</text>
    <circle cx="120" cy="6" r="7" fill="#C8102E"/>
