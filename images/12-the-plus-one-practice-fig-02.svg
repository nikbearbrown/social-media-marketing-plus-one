  <title id="fig-title-02">The two columns of the practice — AI handles vs must be human</title>
  <desc id="fig-desc-02">Two columns. Left: six tasks AI handles (log formatting, pattern detection, weekly summary drafts, voice-drift comparisons, prompt-library maintenance, capability-watch summaries). Right: six tasks that must be human (the reflection, the honest entry, the voice-drift judgment, the boundary-case call, the recovery, the decision to sustain). An ochre arrow runs left to right beneath them.</desc>
