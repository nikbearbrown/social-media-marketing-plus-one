  <text x="500" y="372" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">comment policy</text>

  <!-- Guard marker -->
  <rect x="616" y="308" width="40" height="40" fill="#C8102E"/>
  <text x="636" y="332" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Guard</text>

  <!-- Failure-mode curved arrow -->
  <path d="M 600 200 C 670 200, 670 280, 600 280" fill="none" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Failure caption -->
  <text x="56" y="420" font-family="'Inter', sans-serif" font-size="11" font-style="italic" fill="#545454">Lattice failure mode — Layer 1 compliance read as Layer 2 solved. Format: correct. Fit: absent.</text>
