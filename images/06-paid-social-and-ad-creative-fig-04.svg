  <rect x="390" y="295" width="140" height="65" fill="#787878" stroke="#2a1a0e" stroke-width="0.75"/>
  <text x="460" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#2a1a0e">Incremental lift</text>
  <text x="460" y="396" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#545454">recovered from a holdout RCT</text>
  <text x="460" y="412" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#545454">100 (index)</text>

  <!-- Gap bracket between top of bar1 and top of bar2 -->
  <line x1="315" y1="118" x2="345" y2="118" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="345" y1="118" x2="345" y2="295" stroke="#2a1a0e" stroke-width="1"/>
