<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04 fig-desc-04">
  <title id="fig-title-04">Measured lift vs incrementality — the Lewis-Rao gap</title>
  <desc id="fig-desc-04">A side-by-side comparison. The left bar shows the large "measured lift" the platform reports; the right bar shows the smaller "incremental lift" recovered by an RCT. The gap between them is what attribution models miss and where human judgment lives.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" book-slug="social-media-marketing-plus-one" chapter="06-paid-social-and-ad-creative" figure-number="04" figure-title="Measured lift vs incrementality — the Lewis-Rao gap" figure-slug="lewis-rao-incrementality-gap" figure-type="COMPARISON" priority="Important" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="pantry/06-paid-social-and-ad-creative-cajal.md"/></metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker></defs>
  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">The Lewis-Rao gap — what the platform claims vs what the campaign actually caused</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Lewis-Rao (2015) and Blake-Nosko-Tadelis (2015): attribution often counts conversions that would have happened anyway.</text>

  <!-- Plot region -->
  <rect x="80" y="100" width="540" height="260" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>

  <!-- Y axis -->
