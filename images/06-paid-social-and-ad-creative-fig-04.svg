  <text x="355" y="232" font-family="'Inter', sans-serif" font-size="11" fill="#545454">would-have-bought-anyway</text>
  <text x="355" y="252" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-size="12" fill="#C8860E">where human judgment lives</text>

  <!-- Annotation arrow at top of red bar pointing to "platform claim" -->
  <text x="240" y="112" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-size="12" fill="#C8102E">what the dashboard reports</text>

  <text x="460" y="289" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-size="12" fill="#2a1a0e">what the campaign actually caused</text>

