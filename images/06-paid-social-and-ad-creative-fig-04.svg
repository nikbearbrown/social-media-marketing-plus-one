  <text x="32" y="468" font-family="'Inter', sans-serif" font-size="10" fill="#545454">Lewis &amp; Rao 2015 QJE · Blake, Nosko &amp; Tadelis 2015 Econometrica · Pritchard P&amp;G walk-back 2017/2019 [verify]</text>
