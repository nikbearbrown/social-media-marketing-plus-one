  <line x1="80" y1="360" x2="620" y2="360" stroke="#2a1a0e" stroke-width="1"/>

  <!-- Y tick labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#545454">
    <text x="74" y="364" text-anchor="end">0</text>
    <text x="74" y="299" text-anchor="end">25</text>
    <text x="74" y="234" text-anchor="end">50</text>
    <text x="74" y="169" text-anchor="end">75</text>
    <text x="74" y="104" text-anchor="end">100</text>
  </g>
  <line x1="80" y1="295" x2="620" y2="295" stroke="#D4D4D4" stroke-width="0.5"/>
  <line x1="80" y1="230" x2="620" y2="230" stroke="#D4D4D4" stroke-width="0.5"/>
  <line x1="80" y1="165" x2="620" y2="165" stroke="#D4D4D4" stroke-width="0.5"/>

  <!-- Y axis title -->
  <text x="32" y="230" font-family="'Inter', sans-serif" font-size="11" fill="#545454" transform="rotate(-90 32 230)" text-anchor="middle">conversions claimed (index, true incremental = 100)</text>

  <!-- Bar 1: Measured lift (red, tall) -->
  <!-- value = 340 (i.e. platform reports 3.4x the true causal lift) -->
  <rect x="170" y="118" width="140" height="242" fill="#C8102E" stroke="#2a1a0e" stroke-width="0.75"/>
  <text x="240" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#2a1a0e">Measured lift</text>
  <text x="240" y="396" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#545454">platform-reported via last-click / MTA</text>
  <text x="240" y="412" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#545454">~340 (index)</text>

