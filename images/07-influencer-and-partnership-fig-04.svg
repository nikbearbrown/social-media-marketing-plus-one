<svg viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04 fig-desc-04">
  <title id="fig-title-04">FTC 16 CFR Part 255 disclosure decision tree</title>
  <desc id="fig-desc-04">A vertical decision tree for the FTC Endorsement Guides (16 CFR Part 255, revised 2023). The root asks whether a material connection exists. Branches lead to four outcomes: no disclosure needed, clear paid case (Delegate), gifted gray zone (Delegate-with-Review), and ambiguous-benefit case requiring counsel (Guard).</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" book-slug="social-media-marketing-plus-one" chapter="07-influencer-and-partnership" figure-number="04" figure-title="FTC 16 CFR Part 255 disclosure decision tree" figure-slug="ftc-part-255-decision-tree" figure-type="DECISION_TREE" priority="Important" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="pantry/07-influencer-and-partnership-cajal.md"/></metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker></defs>
  <rect x="0" y="0" width="700" height="600" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">FTC 16 CFR Part 255 — where the disclosure gray zones live</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Endorsement Guides revised 2023. Advertiser liable for inadequate disclosure regardless of who posted.</text>

  <!-- Root diamond -->
  <polygon points="350,90 470,140 350,190 230,140" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="350" y="132" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#2a1a0e">Material connection</text>
  <text x="350" y="148" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#2a1a0e">to the brand?</text>

  <!-- Left branch: NO -->
  <line x1="280" y1="160" x2="160" y2="220" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="200" y="190" font-family="'JetBrains Mono', monospace" font-size="11" fill="#545454">no</text>

  <!-- Left terminal: no disclosure needed -->
  <rect x="60" y="225" width="200" height="60" fill="#787878" stroke="#2a1a0e" stroke-width="1"/>
  <text x="160" y="248" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">No disclosure required</text>
  <text x="160" y="265" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#FFFFFF">organic mention · no value exchanged</text>
  <text x="160" y="279" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" fill="#FFFFFF">AI can confirm by pattern</text>

  <!-- Right branch: YES -->
  <line x1="420" y1="160" x2="500" y2="220" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="475" y="190" font-family="'JetBrains Mono', monospace" font-size="11" fill="#545454">yes</text>

  <!-- Second diamond: compensation type? -->
  <polygon points="500,225 620,275 500,325 380,275" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="500" y="268" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#2a1a0e">Compensation</text>
  <text x="500" y="284" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#2a1a0e">type?</text>

  <!-- Three sub-branches from second diamond -->
  <!-- Branch A: paid contract -->
  <line x1="425" y1="305" x2="200" y2="380" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="290" y="335" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">paid · contract</text>

  <!-- Branch B: gifted -->
  <line x1="500" y1="328" x2="500" y2="380" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="508" y="358" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">gifted · no contract</text>

  <!-- Branch C: ambiguous -->
  <line x1="575" y1="305" x2="640" y2="350" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="640" y1="350" x2="640" y2="380" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="585" y="338" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">ambiguous</text>

  <!-- Terminal A: Delegate (clear paid case) -->
  <rect x="100" y="385" width="200" height="80" fill="#545454" stroke="#2a1a0e" stroke-width="1"/>
  <text x="200" y="408" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Delegate</text>
  <text x="200" y="425" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#FFFFFF">disclose #ad / #sponsored</text>
  <text x="200" y="439" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#FFFFFF">at first sentence, on platform</text>
  <text x="200" y="455" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">pattern-checkable</text>

  <!-- Terminal B: Delegate-with-Review (gifted gray zone) -->
  <rect x="400" y="385" width="200" height="80" fill="#C8860E" stroke="#2a1a0e" stroke-width="1"/>
  <text x="500" y="408" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Delegate with review</text>
  <text x="500" y="425" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#FFFFFF">gifted product still counts</text>
  <text x="500" y="439" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#FFFFFF">"gifted" / "complimentary" disclosure</text>
  <text x="500" y="455" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">human spot-check</text>

  <!-- Terminal C: Guard (ambiguous, counsel) -->
  <rect x="540" y="490" width="130" height="80" fill="#C8102E" stroke="#2a1a0e" stroke-width="1"/>
  <rect x="535" y="485" width="140" height="90" fill="none" stroke="#C8102E" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="605" y="513" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Guard</text>
  <text x="605" y="530" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#FFFFFF">employee posting,</text>
  <text x="605" y="543" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#FFFFFF">close relationship,</text>
  <text x="605" y="556" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#FFFFFF">implied benefit</text>
  <text x="605" y="571" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FFFFFF">consult counsel</text>

  <!-- Legend / source -->
  <g transform="translate(32,490)">
    <rect x="0" y="0" width="14" height="12" fill="#787878"/>
    <text x="20" y="10" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e">No disclosure</text>
    <rect x="0" y="20" width="14" height="12" fill="#545454"/>
    <text x="20" y="30" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e">Delegate (clear)</text>
    <rect x="0" y="40" width="14" height="12" fill="#C8860E"/>
    <text x="20" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e">Delegate with review</text>
    <rect x="0" y="60" width="14" height="12" fill="#C8102E"/>
    <text x="20" y="70" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e">Guard (counsel)</text>
  </g>
  <text x="32" y="582" font-family="'Inter', sans-serif" font-size="10" fill="#545454">16 CFR Part 255, FTC Endorsement Guides revised 2023 [verify current language at ftc.gov]</text>
</svg>
