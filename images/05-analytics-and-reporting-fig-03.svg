<svg viewBox="0 0 700 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-03">
  <title id="fig-title-03">Pearl's Ladder Applied to Social Analytics</title>
  <desc>Three-rung ladder of causation. Rung one, association, is where AI dashboards operate and answers what happened. Rung two, intervention, asks what happens if we change the lever. Rung three, counterfactual, asks why and what would have happened otherwise. A diagonal arrow shows the unjustified leap from rung-one evidence to rung-three claim.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" book-slug="social-media-marketing-plus-one" chapter="05-analytics-and-reporting" figure-number="03" figure-title="Pearl's Ladder Applied to Social Analytics" figure-slug="pearls-ladder-analytics" figure-type="conceptual-hierarchy" priority="Critical" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="pantry/05-analytics-and-reporting-cajal.md"/></metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker><marker id="arrowOchre" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C8860E"/></marker></defs>
  <rect x="0" y="0" width="700" height="540" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Pearl's ladder — AI sits on rung one and speaks in the language of rung two</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">The mismatch the whole chapter is naming. Climbing the ladder is human work.</text>

  <!-- Ladder rails -->
  <line x1="170" y1="100" x2="170" y2="460" stroke="#2a1a0e" stroke-width="1.5"/>
  <line x1="510" y1="100" x2="510" y2="460" stroke="#2a1a0e" stroke-width="1.5"/>

  <!-- Vertical caption on left side -->
  <text x="60" y="100" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#2a1a0e">↑ JUDGMENT</text>
  <text x="60" y="455" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#2a1a0e">↓ PATTERN</text>

  <!-- TOP RUNG: Counterfactual -->
  <rect x="170" y="115" width="340" height="80" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>
  <text x="180" y="135" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C8102E" font-weight="700">RUNG 3</text>
  <text x="180" y="155" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#2a1a0e">Counterfactual — Why?</text>
  <text x="180" y="175" font-family="'Inter', sans-serif" font-size="11" fill="#545454">"What would have happened if we had not run the campaign?"</text>
  <text x="180" y="190" font-family="'Inter', sans-serif" font-size="10" fill="#787878" font-style="italic">Requires: causal model, ruled-out alternatives, holdout</text>
  <circle cx="160" cy="155" r="6" fill="#C8102E"/>
  <text x="525" y="159" font-family="'Inter', sans-serif" font-size="10" fill="#C8102E" font-weight="600">Guard</text>

  <!-- MIDDLE RUNG: Intervention -->
  <rect x="170" y="220" width="340" height="80" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>
  <text x="180" y="240" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C8102E" font-weight="700">RUNG 2</text>
  <text x="180" y="260" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#2a1a0e">Intervention — What if we do this?</text>
  <text x="180" y="280" font-family="'Inter', sans-serif" font-size="11" fill="#545454">"If we double posting frequency, what happens to engagement?"</text>
  <text x="180" y="295" font-family="'Inter', sans-serif" font-size="10" fill="#787878" font-style="italic">Requires: experiment, A/B test, incrementality study</text>
  <circle cx="160" cy="260" r="6" fill="#C8102E"/>
  <text x="525" y="264" font-family="'Inter', sans-serif" font-size="10" fill="#C8102E" font-weight="600">Guard</text>

  <!-- BOTTOM RUNG: Association -->
  <rect x="170" y="325" width="340" height="80" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>
  <text x="180" y="345" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454" font-weight="700">RUNG 1</text>
  <text x="180" y="365" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#2a1a0e">Association — What happened?</text>
  <text x="180" y="385" font-family="'Inter', sans-serif" font-size="11" fill="#545454">"Engagement rose 12 percent this month versus last."</text>
  <text x="180" y="400" font-family="'Inter', sans-serif" font-size="10" fill="#787878" font-style="italic">Requires: dashboard, counter, average — AI is fluent here</text>
  <circle cx="160" cy="365" r="6" fill="#545454"/>
  <text x="525" y="369" font-family="'Inter', sans-serif" font-size="10" fill="#545454" font-weight="600">Delegate</text>

  <!-- Diagonal "unjustified leap" arrow from rung-one to rung-three -->
  <!-- Path from bottom-right of rung-1 area up to top-right of rung-3 -->
  <line x1="430" y1="385" x2="430" y2="160" stroke="#C8860E" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#arrowOchre)"/>
  <!-- Break-mark across midpoint -->
  <line x1="420" y1="278" x2="440" y2="268" stroke="#FFFFFF" stroke-width="6"/>
  <line x1="418" y1="280" x2="438" y2="270" stroke="#C8102E" stroke-width="1.5"/>
  <line x1="422" y1="276" x2="442" y2="266" stroke="#C8102E" stroke-width="1.5"/>
  <text x="445" y="278" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#C8102E">unjustified</text>
  <text x="445" y="290" font-family="'Inter', sans-serif" font-size="10" fill="#C8102E">leap</text>

  <!-- Caption explaining the leap -->
  <text x="32" y="445" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#2a1a0e">The chapter's argument</text>
  <text x="32" y="460" font-family="'Inter', sans-serif" font-size="10" fill="#545454">AI generates rung-one evidence — counts, averages, comparisons.</text>
  <text x="32" y="474" font-family="'Inter', sans-serif" font-size="10" fill="#545454">Then it phrases the summary in rung-two or rung-three language — recommend, because, why.</text>
  <text x="32" y="488" font-family="'Inter', sans-serif" font-size="10" fill="#545454">The leap is the chapter's load-bearing failure mode. Pre-interpretation checklist is the antidote.</text>

  <!-- Legend -->
  <circle cx="50" cy="510" r="6" fill="#545454"/>
  <text x="65" y="514" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">Delegate — AI operates here</text>
  <circle cx="260" cy="510" r="6" fill="#C8102E"/>
  <text x="275" y="514" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">Guard — practitioner operates here</text>
  <line x1="490" y1="510" x2="514" y2="510" stroke="#C8860E" stroke-width="1.5"/>
  <text x="520" y="514" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">the unjustified leap to watch for</text>
</svg>
