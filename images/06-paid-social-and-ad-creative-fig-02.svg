  <g transform="translate(32,410)">
    <rect x="0" y="0" width="16" height="12" fill="#C8102E"/>
    <text x="22" y="10" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e">Guard — human judgment</text>
