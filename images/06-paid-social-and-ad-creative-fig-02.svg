  <text x="360" y="338" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF">Quarterly brand-metric check</text>
  <text x="360" y="352" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" fill="#FFFFFF">brand-search-volume · share-of-search · awareness tracker</text>

