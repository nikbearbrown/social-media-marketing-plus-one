    <text x="222" y="10" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e">Delegate — AI-handled</text>
    <polygon points="400,4 404,12 412,12 406,17 409,24 400,20 391,24 394,17 388,12 396,12" fill="#C8860E"/>
