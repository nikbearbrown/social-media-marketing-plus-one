  <line x1="40" y1="280" x2="190" y2="280" stroke="#545454" stroke-width="0.75" stroke-dasharray="3,2"/>
  <text x="115" y="273" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" fill="#545454">campaign duration</text>

  <!-- Annotation under stages 1 and 5 -->
  <text x="80" y="118" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="13" font-style="italic" fill="#C8860E">consequential</text>
  <text x="80" y="134" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="13" font-style="italic" fill="#C8860E">judgment</text>

  <text x="487" y="118" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="13" font-style="italic" fill="#C8860E">consequential</text>
  <text x="487" y="134" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="13" font-style="italic" fill="#C8860E">judgment</text>

