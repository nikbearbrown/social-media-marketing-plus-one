  <text x="160" y="154" font-family="'Inter', sans-serif" font-size="10" fill="#C8102E">fast collapse</text>

  <text x="260" y="190" font-family="'Inter', sans-serif" font-size="10" fill="#545454">low commitment,</text>
  <text x="260" y="202" font-family="'Inter', sans-serif" font-size="10" fill="#545454">sustained</text>

  <!-- Bottom annotation -->
  <text x="32" y="456" font-family="'Inter', sans-serif" font-size="11" font-style="italic" fill="#2a1a0e">Adoption is not the goal — sustainable practice is. Minimum viable wins because friction is low enough to survive a bad week.</text>
