  <!-- X-axis -->
  <line x1="80" y1="380" x2="660" y2="380" stroke="#2a1a0e" stroke-width="1"/>

  <!-- Y gridlines and ticks: 0, 20, 40, 60, 80, 100 -->
  <!-- y maps: 100% = y100, 0% = y380 -> per-percent = 2.8 -->
  <g stroke="#D4D4D4" stroke-width="0.5" opacity="0.7">
    <line x1="80" y1="156" x2="660" y2="156"/>
    <line x1="80" y1="212" x2="660" y2="212"/>
