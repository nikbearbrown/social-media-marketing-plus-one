<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04">
  <title id="fig-title-04">Adoption-Then-Abandonment Curve</title>
  <desc>A line chart over twelve months shows two practice trajectories. The high-friction practice collapses from about eighty percent adherence to under twenty by month six. The minimum-viable practice holds near sixty percent because friction is low. Minimum viable wins.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" book-slug="social-media-marketing-plus-one" chapter="12-the-plus-one-practice" figure-number="04" figure-title="Adoption-Then-Abandonment Curve" figure-slug="adoption-abandonment-curve" figure-type="line-chart" priority="Critical" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="pantry/12-the-plus-one-practice-cajal.md"/></metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker></defs>
  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Adoption-then-abandonment — why the minimum-viable practice is the one that survives</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">~70% of new practices are abandoned within 90 days (Norcross et al.). Friction predicts collapse better than ambition predicts success.</text>

