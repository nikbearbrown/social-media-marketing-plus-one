  <text x="500" y="210" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#787878">correction</text>

  <text x="32" y="468" font-family="'Inter', sans-serif" font-size="10" fill="#545454">Vosoughi, Roy &amp; Aral 2018, Science 359:1146 · United Express Flight 3411 timeline, April 9–11, 2017 [verify]</text>
