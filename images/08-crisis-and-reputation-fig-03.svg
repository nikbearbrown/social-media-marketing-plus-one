<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-03 fig-desc-03">
  <title id="fig-title-03">Vosoughi — false-news velocity vs correction velocity</title>
  <desc id="fig-desc-03">Two cumulative-reach curves over time. The upper red curve is the false-news cascade climbing rapidly (Vosoughi et al. 2018). The lower gray curve is the correction climbing more slowly with persistent lag. At t=12h the gap is enormous; the United late-correction at t=36h arrives after the story has reached most viewers.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" book-slug="social-media-marketing-plus-one" chapter="08-crisis-and-reputation" figure-number="03" figure-title="Vosoughi — false-news velocity vs correction velocity" figure-slug="vosoughi-false-news-velocity" figure-type="LINE" priority="Critical" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="pantry/08-crisis-and-reputation-cajal.md"/></metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker></defs>
  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">False news travels six times faster than its correction</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Vosoughi, Roy &amp; Aral (2018, Science) on Twitter cascades — applied to the United Flight 3411 timeline.</text>

