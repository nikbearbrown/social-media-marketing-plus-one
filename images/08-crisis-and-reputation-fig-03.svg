  <line x1="80" y1="380" x2="640" y2="380" stroke="#2a1a0e" stroke-width="1"/>

  <!-- Y-axis title -->
  <text x="36" y="235" font-family="'Inter', sans-serif" font-size="11" fill="#545454" transform="rotate(-90 36 235)" text-anchor="middle">cumulative reach (views, log scale)</text>

  <!-- X-axis title -->
  <text x="360" y="412" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#2a1a0e">hours since the cascade started</text>

  <!-- X axis tick labels — t=0, 4h, 12h, 24h, 36h, 72h -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#545454">
    <text x="80" y="396" text-anchor="middle">0h</text>
