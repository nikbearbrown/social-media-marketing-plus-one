  <line x1="80" y1="380" x2="80" y2="392" stroke="#545454" stroke-width="2"/>
  <line x1="173" y1="380" x2="173" y2="392" stroke="#545454" stroke-width="2"/>
  <text x="125" y="436" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-size="11" fill="#545454">AI monitoring flags fired here —</text>
  <text x="125" y="450" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-size="11" fill="#545454">well before either curve inflects</text>

