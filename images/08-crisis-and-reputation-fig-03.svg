    <line x1="80" y1="264" x2="640" y2="264"/>
    <line x1="80" y1="322" x2="640" y2="322"/>
  </g>

  <!-- Y axis labels (log-like) -->
  <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">
    <text x="74" y="384" text-anchor="end">1k</text>
