  <text x="305" y="220" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-size="13" fill="#2a1a0e">the gap at t = 12h</text>
  <text x="305" y="236" font-family="'Inter', sans-serif" font-size="11" fill="#545454">100M views vs ~50k corrections</text>

