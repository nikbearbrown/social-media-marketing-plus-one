<svg viewBox="0 0 700 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-02 fig-desc-02">
  <title id="fig-title-02">Lattice Case — Cross-Posted vs Corrected Approach</title>
  <desc id="fig-desc-02">Two-panel comparison. Left: original cross-post — one source fans out to four platforms, three underperform. Right: corrected approach — same source flows through review to three platforms, two are explicitly refused.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" chapter="09-platform-specific-execution" figure-number="02" figure-title="Lattice Case — Cross-Posted vs Corrected" figure-type="infographic" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="chapters/09-platform-specific-execution.md"/></metadata>
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545454"/>
    </marker>
    <marker id="arrowOchre" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C8860E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="540" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Lattice case — cross-posted (left) vs corrected (right)</text>
  <text x="32" y="56" font-family="'Inter', sans-serif" font-size="11" fill="#545454">Same source content. Different campaign. The refusal call is load-bearing.</text>

  <!-- Vertical divider -->
  <line x1="350" y1="80" x2="350" y2="500" stroke="#D4D4D4" stroke-width="1"/>

  <!-- ===== LEFT PANEL — Original ===== -->
  <text x="180" y="100" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#2a1a0e" text-anchor="middle">Original — cross-post, no re-voicing</text>

  <!-- Source content -->
  <rect x="115" y="120" width="130" height="44" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="180" y="138" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e" text-anchor="middle">12-min panel</text>
  <text x="180" y="154" font-family="'Inter', sans-serif" font-size="10" fill="#545454" text-anchor="middle">source content</text>

  <!-- Four fan-out arrows (gray = unguarded delegation) -->
  <line x1="180" y1="164" x2="70" y2="240" stroke="#545454" stroke-width="1" marker-end="url(#arrowGray)"/>
  <line x1="180" y1="164" x2="148" y2="240" stroke="#545454" stroke-width="1" marker-end="url(#arrowGray)"/>
  <line x1="180" y1="164" x2="212" y2="240" stroke="#545454" stroke-width="1" marker-end="url(#arrowGray)"/>
  <line x1="180" y1="164" x2="290" y2="240" stroke="#545454" stroke-width="1" marker-end="url(#arrowGray)"/>

  <!-- Four platform output rectangles -->
  <!-- TikTok — underperforming -->
  <rect x="42" y="250" width="58" height="44" fill="#C8102E" opacity="0.3" stroke="#C8102E" stroke-width="1"/>
  <text x="71" y="270" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">TikTok</text>
  <text x="71" y="284" font-family="'Inter', sans-serif" font-size="9" fill="#545454" text-anchor="middle">&lt;400 views</text>
  <circle cx="71" cy="308" r="4" fill="#C8102E"/>

  <!-- Reels — underperforming -->
  <rect x="120" y="250" width="58" height="44" fill="#C8102E" opacity="0.3" stroke="#C8102E" stroke-width="1"/>
  <text x="149" y="270" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">Reels</text>
  <text x="149" y="284" font-family="'Inter', sans-serif" font-size="9" fill="#545454" text-anchor="middle">flat</text>
  <circle cx="149" cy="308" r="4" fill="#C8102E"/>

  <!-- LinkedIn — performing -->
  <rect x="183" y="250" width="58" height="44" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="212" y="270" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">LinkedIn</text>
  <text x="212" y="284" font-family="'Inter', sans-serif" font-size="9" fill="#545454" text-anchor="middle">benchmark</text>

  <!-- X — wrong-kind engagement -->
  <rect x="261" y="250" width="58" height="44" fill="#C8102E" opacity="0.3" stroke="#C8102E" stroke-width="1"/>
  <text x="290" y="270" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">X</text>
  <text x="290" y="284" font-family="'Inter', sans-serif" font-size="9" fill="#545454" text-anchor="middle">hostile replies</text>
  <circle cx="290" cy="308" r="4" fill="#C8102E"/>

  <text x="180" y="350" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#545454" text-anchor="middle">Format compliant. Fit absent.</text>
  <text x="180" y="368" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#545454" text-anchor="middle">Three of four under-perform.</text>

  <!-- ===== RIGHT PANEL — Corrected ===== -->
  <text x="525" y="100" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#2a1a0e" text-anchor="middle">Corrected — re-voiced + refusal</text>

  <!-- Source content -->
  <rect x="460" y="120" width="130" height="44" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="525" y="138" font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e" text-anchor="middle">12-min panel</text>
  <text x="525" y="154" font-family="'Inter', sans-serif" font-size="10" fill="#545454" text-anchor="middle">source content</text>

  <!-- Three ochre arrows (Delegate-with-Review) -->
  <line x1="500" y1="164" x2="435" y2="240" stroke="#C8860E" stroke-width="1.25" marker-end="url(#arrowOchre)"/>
  <line x1="525" y1="164" x2="525" y2="240" stroke="#C8860E" stroke-width="1.25" marker-end="url(#arrowOchre)"/>
  <line x1="550" y1="164" x2="615" y2="240" stroke="#C8860E" stroke-width="1.25" marker-end="url(#arrowOchre)"/>

  <!-- Three performing platform outputs -->
  <rect x="406" y="250" width="58" height="44" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="435" y="270" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">LinkedIn</text>
  <text x="435" y="284" font-family="'Inter', sans-serif" font-size="9" fill="#545454" text-anchor="middle">long-form</text>

  <rect x="496" y="250" width="58" height="44" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="525" y="270" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">YouTube</text>
  <text x="525" y="284" font-family="'Inter', sans-serif" font-size="9" fill="#545454" text-anchor="middle">full panel</text>

  <rect x="586" y="250" width="58" height="44" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="615" y="270" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">X (research)</text>
  <text x="615" y="284" font-family="'Inter', sans-serif" font-size="9" fill="#545454" text-anchor="middle">personal acct</text>

  <!-- Refused platforms -->
  <text x="525" y="340" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#C8102E" text-anchor="middle">Explicitly refused</text>

  <rect x="436" y="350" width="80" height="40" fill="none" stroke="#C8102E" stroke-width="1.25"/>
  <line x1="436" y1="350" x2="516" y2="390" stroke="#C8102E" stroke-width="1.25"/>
  <line x1="516" y1="350" x2="436" y2="390" stroke="#C8102E" stroke-width="1.25"/>
  <text x="476" y="375" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">TikTok</text>

  <rect x="534" y="350" width="80" height="40" fill="none" stroke="#C8102E" stroke-width="1.25"/>
  <line x1="534" y1="350" x2="614" y2="390" stroke="#C8102E" stroke-width="1.25"/>
  <line x1="614" y1="350" x2="534" y2="390" stroke="#C8102E" stroke-width="1.25"/>
  <text x="574" y="375" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">Reels</text>

  <text x="525" y="420" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#545454" text-anchor="middle">Refusal documented.</text>
  <text x="525" y="438" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#545454" text-anchor="middle">Capacity spent where fit exists.</text>

  <!-- Legend -->
  <rect x="56" y="468" width="14" height="14" fill="#545454"/>
  <text x="76" y="479" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">unguarded delegation</text>
  <rect x="220" y="468" width="14" height="14" fill="#C8860E"/>
  <text x="240" y="479" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">delegate-with-review</text>
  <rect x="386" y="468" width="14" height="14" fill="#C8102E"/>
  <text x="406" y="479" font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">underperformance / refusal</text>
</svg>
