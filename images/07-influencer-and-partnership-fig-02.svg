<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-02 fig-desc-02">
  <title id="fig-title-02">Campaign cycle: handoffs and time estimates</title>
  <desc id="fig-desc-02">A horizontal seven-stage influencer campaign flow. Fully human stages are red; fully AI stages are gray; split stages show AI draft on the left half and human review on the right. Stage 3, shortlist review, is highlighted as the load-bearing repair point with a ringed marker.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" chapter="07-influencer-and-partnership" figure-number="02" figure-title="Campaign cycle with stage ownership" figure-type="IMAGE" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="chapters/07-influencer-and-partnership.md"/></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="18" fill="#2a1a0e">Campaign cycle: handoffs and time estimates</text>
  <text x="32" y="56" font-family="'Inter', sans-serif" font-size="12" fill="#545454">Red = human · gray = AI · split = AI drafts, human edits · ringed = load-bearing</text>

  <!-- Legend -->
  <g font-family="'Inter', sans-serif" font-size="10" fill="#2a1a0e">
    <rect x="32" y="78" width="14" height="14" fill="#C8102E"/><text x="52" y="89">Human (Guard)</text>
    <rect x="160" y="78" width="14" height="14" fill="#545454"/><text x="180" y="89">AI (Delegate)</text>
    <rect x="270" y="78" width="14" height="14" fill="#545454"/><rect x="277" y="78" width="7" height="14" fill="#C8860E"/><text x="293" y="89">Delegate-with-Review</text>
  </g>

  <!-- Stages: 7 boxes in two rows of 4 and 3, connected -->
  <g font-family="'Inter', sans-serif" font-size="11" fill="#2a1a0e">
    <!-- Stage 1 — Brief (human) -->
    <rect x="32" y="130" width="120" height="80" fill="#C8102E" stroke="#2a1a0e" stroke-width="0.75"/>
    <text x="42" y="150" font-size="10" font-weight="700" fill="#FFFFFF">1. BRIEF</text>
    <text x="42" y="170" font-size="11" fill="#FFFFFF">Human</text>
    <text x="42" y="186" font-size="10" fill="#FFFFFF">Life-stage + intent</text>
    <text x="42" y="200" font-size="10" fill="#FFFFFF" font-family="'JetBrains Mono', monospace">~3 hr</text>

    <!-- Stage 2 — Discovery + audit (AI) -->
    <rect x="172" y="130" width="120" height="80" fill="#545454" stroke="#2a1a0e" stroke-width="0.75"/>
    <text x="182" y="150" font-size="10" font-weight="700" fill="#FFFFFF">2. DISCOVERY + AUDIT</text>
    <text x="182" y="170" font-size="11" fill="#FFFFFF">AI</text>
    <text x="182" y="186" font-size="10" fill="#FFFFFF">Filter, score, fraud</text>
    <text x="182" y="200" font-size="10" fill="#FFFFFF" font-family="'JetBrains Mono', monospace">~30 min</text>

    <!-- Stage 3 — Shortlist review (human, ringed) -->
    <rect x="312" y="130" width="120" height="80" fill="#C8102E" stroke="#2a1a0e" stroke-width="0.75"/>
    <rect x="307" y="125" width="130" height="90" fill="none" stroke="#C8860E" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="322" y="150" font-size="10" font-weight="700" fill="#FFFFFF">3. SHORTLIST REVIEW</text>
    <text x="322" y="170" font-size="11" fill="#FFFFFF">Human · load-bearing</text>
    <text x="322" y="186" font-size="10" fill="#FFFFFF">Fit read, forward-look</text>
    <text x="322" y="200" font-size="10" fill="#FFFFFF" font-family="'JetBrains Mono', monospace">~2–4 hr</text>

    <!-- Stage 4 — Outreach (split) -->
    <rect x="452" y="130" width="60" height="80" fill="#545454" stroke="#2a1a0e" stroke-width="0.75"/>
    <rect x="512" y="130" width="60" height="80" fill="#C8860E" stroke="#2a1a0e" stroke-width="0.75"/>
    <text x="462" y="150" font-size="10" font-weight="700" fill="#FFFFFF">4. OUTREACH</text>
    <text x="462" y="170" font-size="10" fill="#FFFFFF">AI draft</text>
    <text x="520" y="170" font-size="10" fill="#FFFFFF">1st sentence</text>
    <text x="462" y="200" font-size="10" fill="#FFFFFF" font-family="'JetBrains Mono', monospace">~45 min</text>

    <!-- Arrows row 1 -->
    <line x1="152" y1="170" x2="172" y2="170" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="292" y1="170" x2="312" y2="170" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="432" y1="170" x2="452" y2="170" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Bend -->
    <line x1="572" y1="170" x2="600" y2="170" stroke="#2a1a0e" stroke-width="1"/>
    <line x1="600" y1="170" x2="600" y2="250" stroke="#2a1a0e" stroke-width="1"/>
    <line x1="600" y1="250" x2="572" y2="250" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Stage 5 — Negotiation (split) -->
    <rect x="452" y="260" width="60" height="80" fill="#545454" stroke="#2a1a0e" stroke-width="0.75"/>
    <rect x="512" y="260" width="60" height="80" fill="#C8102E" stroke="#2a1a0e" stroke-width="0.75"/>
    <text x="462" y="280" font-size="10" font-weight="700" fill="#FFFFFF">5. NEGOTIATION</text>
    <text x="462" y="300" font-size="10" fill="#FFFFFF">AI skeleton</text>
    <text x="520" y="300" font-size="10" fill="#FFFFFF">Read the asks</text>
    <text x="462" y="330" font-size="10" fill="#FFFFFF" font-family="'JetBrains Mono', monospace">~variable</text>

    <!-- Stage 6 — Content review (split) -->
    <rect x="312" y="260" width="60" height="80" fill="#545454" stroke="#2a1a0e" stroke-width="0.75"/>
    <rect x="372" y="260" width="60" height="80" fill="#C8102E" stroke="#2a1a0e" stroke-width="0.75"/>
    <text x="322" y="280" font-size="10" font-weight="700" fill="#FFFFFF">6. CONTENT REVIEW</text>
    <text x="322" y="300" font-size="10" fill="#FFFFFF">AI checks</text>
    <text x="380" y="300" font-size="10" fill="#FFFFFF">Tone, disclosure</text>
    <text x="322" y="330" font-size="10" fill="#FFFFFF" font-family="'JetBrains Mono', monospace">~1 hr</text>

    <!-- Stage 7 — Reporting + narrative (split) -->
    <rect x="172" y="260" width="60" height="80" fill="#545454" stroke="#2a1a0e" stroke-width="0.75"/>
    <rect x="232" y="260" width="60" height="80" fill="#C8102E" stroke="#2a1a0e" stroke-width="0.75"/>
    <text x="182" y="280" font-size="10" font-weight="700" fill="#FFFFFF">7. REPORT + NARRATIVE</text>
    <text x="182" y="300" font-size="10" fill="#FFFFFF">AI numbers</text>
    <text x="240" y="300" font-size="10" fill="#FFFFFF">Human story</text>
    <text x="182" y="330" font-size="10" fill="#FFFFFF" font-family="'JetBrains Mono', monospace">~2 hr</text>

    <!-- Arrows row 2 (right to left) -->
    <line x1="452" y1="300" x2="432" y2="300" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="312" y1="300" x2="292" y2="300" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  </g>

  <!-- Timeline arrow -->
  <line x1="32" y1="400" x2="650" y2="400" stroke="#545454" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="32" y="420" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">campaign start</text>
  <text x="320" y="420" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">handoff at shortlist</text>
  <text x="555" y="420" font-family="'JetBrains Mono', monospace" font-size="10" fill="#545454">campaign close</text>
  <text x="32" y="450" font-family="'EB Garamond', serif" font-style="italic" font-size="12" fill="#2a1a0e">The tools shorten the path to the decision. The decision still requires a person.</text>
</svg>
