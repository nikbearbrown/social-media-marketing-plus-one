<svg viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-10-02 fig-desc-10-02">
  <title id="fig-title-10-02">Map Lifecycle — Nine-Station Audit Cycle</title>
  <desc id="fig-desc-10-02">A clockwise nine-station cycle. Stations: inventory, classify, tool audit, draft lists, boundary cases, trial, revise, socialize, quarterly re-audit. The quarterly re-audit arrow closes the loop. Center holds the cycle outputs: Delegate, Guard, and the boundary backlog.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" chapter="10-building-your-own-map" figure-number="02" figure-title="Map Lifecycle" figure-type="infographic" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="chapters/10-building-your-own-map.md"/></metadata>
