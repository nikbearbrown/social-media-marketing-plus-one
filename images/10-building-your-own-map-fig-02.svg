  <text x="600" y="299" font-family="'Inter', sans-serif" font-size="9" fill="#545454">incl. shadow AI</text>

  <!-- Station 4 — draft lists -->
  <circle cx="528" cy="423" r="22" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
