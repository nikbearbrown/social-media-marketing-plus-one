  <text x="350" y="86" font-family="'Inter', sans-serif" font-size="9" fill="#545454" text-anchor="middle">two weeks of actual tasks</text>

  <!-- Station 2 — classify -->
  <circle cx="503" cy="172" r="22" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
