<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-01">
  <title id="fig-title-01">The Doshi-Hauser Divergence — Two Metrics That Move in Opposite Directions</title>
  <desc>Two-line chart. Horizontal axis: AI assistance intensity. Vertical axis: relative index 0 to 100. One line rises as AI use increases — individual output quality. The other falls — collective distinctiveness across writers. The lines cross near the middle; a shaded zone past the crossing marks the structural homogenization region.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" chapter="03-content-creation" figure-number="01" figure-title="The Doshi-Hauser Divergence" figure-type="chart" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="chapters/03-content-creation.md"/></metadata>
