  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Individual quality rises. Collective distinctiveness falls.</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Two metrics moving in opposite directions as AI assistance increases — the homogenization effect Doshi and Hauser (2024) documented.</text>

