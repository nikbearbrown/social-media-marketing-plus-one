  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Deming — most "anomalies" are common-cause noise, not signal</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Reacting to common-cause variation as if it were special-cause makes the system worse. The Red Bead trap.</text>

