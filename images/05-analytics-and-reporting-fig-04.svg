<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04">
  <title id="fig-title-04">Deming — Common-Cause vs Special-Cause Variation</title>
  <desc>A control chart of a weekly metric. A mean line runs horizontally with dashed upper and lower three-sigma limits. Most weekly points oscillate within the limits — common-cause variation, no action required. Two points break the upper limit — special-cause variation, where the practitioner should investigate. An AI anomaly flag fires on a common-cause point, illustrating the Red Bead trap.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Social Media Marketing plus One" book-slug="social-media-marketing-plus-one" chapter="05-analytics-and-reporting" figure-number="04" figure-title="Deming — Common-Cause vs Special-Cause Variation" figure-slug="deming-control-chart" figure-type="chart" priority="Recommended" author="Nik Bear Brown Milivoje Davidovic" date-generated="2026-05-27" source-file="pantry/05-analytics-and-reporting-cajal.md"/></metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker></defs>
